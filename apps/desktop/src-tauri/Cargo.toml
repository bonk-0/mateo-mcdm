[package]
name = "mateo-desktop"
version = "0.1.0"
description = "Mateo desktop shell"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "mateo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[dev-dependencies]
# `test` gives the mock runtime used by the `sql_bridge` example (real SQL plugin, no window).
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
