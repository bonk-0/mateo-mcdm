name: Release web build

# Builds the web app from a locked dependency set and uploads it as one archive. The
# archive is the whole app: static files that any HTTPS host can serve from any folder
# (docs/release-notes/README.md). Run by hand, or push a tag such as v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Same inputs, same bytes: file times in the archive come from here.
      SOURCE_DATE_EPOCH: '1767225600'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Archive
        working-directory: apps/web/dist
        run: |
          find . -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +
          find . -type f | LC_ALL=C sort | zip -X -q -@ "$GITHUB_WORKSPACE/mateo-web.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mateo-web
          path: mateo-web.zip
          if-no-files-found: error
