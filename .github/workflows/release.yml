name: Release installers

# Builds the desktop installers on all three platforms from a locked dependency set.
# Run by hand, or push a tag such as v0.1.0. Installers are uploaded as workflow artifacts.
# Code signing is optional: set the secrets listed in docs/release-notes/README.md and the
# installers are signed; without them the build is reproducible but unsigned.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  installers:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            artifact: mateo-windows
            paths: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - name: macOS
            os: macos-latest
            bundles: dmg
            artifact: mateo-macos
            paths: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,appimage
            artifact: mateo-linux
            paths: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    env:
      # Same inputs, same bytes where the toolchain allows it.
      SOURCE_DATE_EPOCH: '1767225600'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Build installers
        run: pnpm --filter @mateo/desktop exec tauri build --bundles ${{ matrix.bundles }} -- --locked

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 30
